backend:
  name: github
  repo: MarceloBadaro/Atelier_Pe_de_Outono
  branch: main

media_folder: "images/produtos"
public_folder: "images/produtos"

collections:
  - name: "loja"
    label: "Gerenciar Vitrine"
    files:
      - label: "Produtos Pronta Entrega"
        name: "produtos"
        file: "produtos.json"
        fields:
          - label: "Lista de Bichinhos / Produtos"
            name: "itens"
            widget: "list"
            fields:
              - { label: "Nome do Produto", name: "titulo", widget: "string" }
              - { label: "Categoria (ex: Artesanato, Decoração)", name: "categoria", widget: "string" }
              - { label: "Preço (apenas números, ex: 120.00)", name: "preco", widget: "number", value_type: "float" }
              - { label: "Foto do Produto", name: "imagem", widget: "image" }
